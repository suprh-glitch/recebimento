<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel Recebimento – Filial BG</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f6f8;--card:#fff;--tx:#1b2430;--mut:#6b7686;--bd:#e3e7ee;--ok:#2e9e6b;--and:#e0a020;--ag:#3b7dd8;--bad:#d9534f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#111519;--card:#1a2027;--tx:#e8edf3;--mut:#93a0b1;--bd:#2a323c;--ok:#47c48a;--and:#f0b440;--ag:#6aa3f0;--bad:#ef7b77}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px}
h1{font-size:21px;margin:0}.sub{color:var(--mut);font-size:13px;margin:2px 0 14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.k{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}.v{font-size:28px;font-weight:700}.n{font-size:12px;color:var(--mut)}
h2{font-size:14px;margin:0 0 10px}
.row{display:grid;grid-template-columns:130px 1fr 52px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.bar{height:14px;background:var(--bd);border-radius:7px;overflow:hidden}.bar i{display:block;height:100%;border-radius:7px}
.stack{display:flex;height:22px;border-radius:11px;overflow:hidden;margin:8px 0}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut)}.leg b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px;min-width:700px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mut);font-weight:600;font-size:12px}
.pill{padding:2px 9px;border-radius:10px;font-size:12px;color:#fff}.alert{border-left:4px solid var(--bad)}ul{margin:0;padding-left:18px;font-size:13px}li{margin:4px 0}
.sel{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.sel button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:5px 12px;border-radius:16px;cursor:pointer;font-size:13px}
.sel button.on{background:var(--ag);color:#fff;border-color:var(--ag)}
.sel label{font-size:13px;color:var(--mut);display:flex;gap:6px;align-items:center}
select,input[type=date]{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:4px 8px;font:inherit;font-size:13px}
#cal{position:absolute;top:100%;left:0;z-index:20;width:300px;max-width:92vw;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);margin-top:6px}
#cal[hidden]{display:none}#cal .ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}#cal .ch button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:16px}
#cal .cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}#cal .dw{font-size:11px;color:var(--mut);padding:2px 0}
#cal .dd{position:relative;height:40px;border:0;background:transparent;color:var(--tx);border-radius:8px;cursor:pointer;font-size:13px}
#cal .dd:hover{background:var(--bd)}#cal .dd.td{box-shadow:inset 0 0 0 1px var(--mut)}#cal .dd.sel{box-shadow:inset 0 0 0 2px var(--ag);font-weight:700}
#cal .dot{position:absolute;top:1px;right:1px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--ag);color:#fff;font:700 10px/17px system-ui,sans-serif;font-style:normal}
#cal .cf{display:flex;gap:8px;margin-top:10px}#cal .cf button{flex:1;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px;cursor:pointer;font-size:13px}
.err{color:var(--bad)}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
html{-webkit-text-size-adjust:100%}
@media (max-width:640px){
 body{padding:12px;font-size:14px}
 h1{font-size:18px}
 .sub{font-size:12px;margin-bottom:10px}
 .grid{gap:8px;margin-bottom:8px;grid-template-columns:repeat(2,1fr)}
 .card{padding:12px;border-radius:10px;min-width:0}
 .v{font-size:24px}
 .k{font-size:11px}
 .row{grid-template-columns:96px 1fr 48px;gap:6px;font-size:12px}
 .row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .sel{gap:6px}
 .sel button{min-height:40px;padding:6px 12px}
 .sel label{flex:1 1 140px;justify-content:space-between}
 select,input[type=date]{font-size:16px;min-height:40px;min-width:0}
 #dbtn{flex:1 1 100%;text-align:left}
 #hj,#rf{flex:1 1 calc(50% - 3px)}
 #cal{width:calc(100vw - 24px);max-width:360px}
 #cal .dd{height:44px}
 .tw{overflow-x:visible}
 table{min-width:0;display:block}
 thead{display:none}
 tbody{display:block}
 tr{display:block;border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin-bottom:8px}
 td{display:flex;justify-content:space-between;gap:12px;border-bottom:0;padding:3px 0;white-space:normal;text-align:right;overflow-wrap:anywhere}
 td::before{content:attr(data-label);color:var(--mut);font-size:12px;font-weight:600;text-align:left;flex:0 0 auto}
 td:empty{display:none}
}
@media (max-width:360px){.grid{grid-template-columns:1fr}}
</style></head><body>
<h1>Recebimento – Filial BG</h1>
<div class="sub" id="status">Carregando a planilha…</div>
<div class="sel" style="position:relative"><button type="button" id="dbtn">📅 Data</button><div id="cal" hidden></div></div>
<div class="sel"><label>De <input type="date" id="d1"></label><label>Até <input type="date" id="d2"></label><button id="hj">Voltar para hoje</button><button id="rf">Atualizar agora</button></div>
<div class="grid" id="kpis"></div>
<div class="grid g2">
 <div class="card"><h2>Status das cargas</h2><div class="stack" id="stack"></div><div class="leg" id="leg"></div></div>
 <div class="card"><h2>Cargas por tipo</h2><div id="tipos"></div></div>
</div>
<div class="grid g2">
 <div class="card"><h2>Duração do descarregamento (maior → menor)</h2><div id="dur"></div><div class="n">Calculada de início e fim; mostra as 12 maiores.</div></div>
 <div class="card alert"><h2>Pontos de atenção</h2><ul id="alerts"></ul></div>
</div>
<div class="card"><h2>Detalhamento</h2><div class="sel" id="sel"></div><div class="tw"><table><thead><tr><th>Data</th><th>Transportadora</th><th>Tipo</th><th>Agendado</th><th>Início</th><th>Fim</th><th>Duração</th><th>Atraso</th><th>Status</th><th>Obs.</th></tr></thead><tbody id="tb"></tbody></table></div></div>
<script>
const SID="18smcSrHisSuGSRsH4fIN-DlbtyMdGKUT8c2WEchgR3A",SRV="Google Sheets";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hoje=new Date().toLocaleDateString("pt-BR",{timeZone:"America/Cuiaba"}),yr=hoje.slice(6);
const COL={"Concluído":"var(--ok)","Em Andamento":"var(--and)","Agendado":"var(--ag)","Atrasado":"var(--bad)","Cancelado":"var(--mut)"};
const ORD=Object.keys(COL);
const TAB={},W={};let day=hoje,f="Todos",upd=null,err=null;
const pl=r=>{let p=r&&r.payload;if(typeof p==="string"){try{p=JSON.parse(p)}catch(e){}}return p};
const t5=x=>{const q=(x||"").trim().match(/^(\d{1,2}):(\d{2})/);return q?q[1].padStart(2,"0")+":"+q[2]:""};
const m=h=>h?+h.slice(0,2)*60+ +h.slice(3):null;
const plain=x=>(x||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const tpn=x=>{const s=plain(x);return /liq/.test(s)?"Mercearia Líquida":/sec[oa]/.test(s)?"Mercearia Seco":/perec/.test(s)?"Perecíveis":/flv/.test(s)?"FLV":s.trim()?x.trim():"Não informado"};
const stn=x=>{const s=plain(x);return /conclu/.test(s)?"Concluído":/andam/.test(s)?"Em Andamento":/atras/.test(s)?"Atrasado":/cancel/.test(s)?"Cancelado":/agend/.test(s)||!s.trim()?"Agendado":x.trim()};
const fmt=x=>x==null?"–":(x>=60?Math.floor(x/60)+"h"+String(x%60).padStart(2,"0"):x+" min");
function mkRows(v,date){return (v||[]).map(r=>{const g=(r[6]||"").trim(),h=(r[7]||"").trim(),eT=/liq|sec[oa]|perec|flv|merc/.test(plain(g)),t=h||(g&&!eT?g:"");if(!t||t.toLowerCase()==="transportadora")return null;
 const ag=t5(r[1]),ini=t5(r[2]),fim=t5(r[3]);let du=null,inc=false;
 if(ini&&fim){const d=m(fim)-m(ini);if(d>=0)du=d;else inc=true}
 const a=m(ag),i=m(ini);
 return{date,t,tp:(h||eT)?tpn(r[6]):"Não informado",ag,ini,fim,du,inc,st:stn(r[5]),ob:(r[8]||"").trim(),atraso:a!=null&&i!=null?i-a:null}}).filter(Boolean)}
const CFG={SID:"18smcSrHisSuGSRsH4fIN-DlbtyMdGKUT8c2WEchgR3A",GS_URL:"",TOKEN:"",API_KEY:"",PROBE_DIAS:7,
 TABS:[["Agendamento 20.10",1576047254],["Agendamento 21.10",0],["Agendamento 22.10",245156319],["Agendamento 23.10",1449936300],["Agendamento 24.10",1922092371],["Agendamento 26.10",231333608],["Agendamento 27.10",197772153],["Agendamento  28.10",570047703],["Agendamento 29.10",680227134],[" Agendamento 30.10",1111699336],[" Agendamento 31.10",202278473]]};
const nd=x=>{x=(x||"").trim();let q=x.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);return q?q[1].padStart(2,"0")+"/"+q[2].padStart(2,"0")+"/"+q[3]:""};
const dateOf=t=>{const q=t.match(/(\d{1,2})\s*\.\s*(\d{1,2})/);return q?q[1].padStart(2,"0")+"/"+q[2].padStart(2,"0")+"/"+yr:null};
function jsonp(url){return new Promise((res,rej)=>{const cb="gv"+Math.random().toString(36).slice(2),sc=document.createElement("script");
 const end=()=>{clearTimeout(to);delete window[cb];sc.remove()};const to=setTimeout(()=>{end();rej(new Error("tempo esgotado"))},15000);
 window[cb]=r=>{end();if(r&&r.status==="ok")res(r.table.rows.map(x=>(x.c||[]).map(c=>c?(c.f!=null?String(c.f):(c.v!=null?String(c.v):"")):"")));else rej(new Error("resposta inválida"))};
 sc.onerror=()=>{end();rej(new Error("sem acesso"))};sc.src=url+"&tqx=out:json;responseHandler:"+cb+"&_="+Date.now();document.head.appendChild(sc)})}
async function readTab(title,gid,probe){let rows;
 if(CFG.API_KEY){const r=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${CFG.SID}/values/${encodeURIComponent("'"+title+"'!A4:I150")}?key=${CFG.API_KEY}`);if(!r.ok)throw new Error("API "+r.status);rows=(await r.json()).values||[]}
 else rows=await jsonp(`https://docs.google.com/spreadsheets/d/${CFG.SID}/gviz/tq?headers=0&`+(gid!=null?"gid="+gid:"sheet="+encodeURIComponent(title)));
 const date=dateOf(title);if(probe&&!rows.some(r=>nd(r[0])===date))throw new Error("aba inexistente");
 return{date,rows:mkRows(rows,date)}}
const gsU=cb=>CFG.GS_URL+(CFG.GS_URL.includes("?")?"&":"?")+"token="+encodeURIComponent(CFG.TOKEN)+(cb?"&callback="+cb:"")+"&_="+Date.now();
function gsJsonp(){return new Promise((res,rej)=>{const cb="gs"+Math.random().toString(36).slice(2),sc=document.createElement("script");
 const end=()=>{clearTimeout(to);delete window[cb];sc.remove()};const to=setTimeout(()=>{end();rej(new Error("tempo esgotado"))},20000);
 window[cb]=d=>{end();res(d)};sc.onerror=()=>{end();rej(new Error("sem acesso"))};sc.src=gsU(cb);document.head.appendChild(sc)})}
async function gsLer(){let d;try{const r=await fetch(gsU());if(!r.ok)throw 0;d=await r.json()}catch(e){d=await gsJsonp()}
 if(!d||d.error||!Array.isArray(d.tabs))throw new Error("resposta inválida");return d}
let busy=false;
async function refresh(){if(busy)return;busy=true;$("status").textContent="Atualizando…";
 try{if(CFG.GS_URL){const d=await gsLer();Object.keys(TAB).forEach(k=>delete TAB[k]);let ok=0;
   d.tabs.forEach(t=>{const dt=dateOf(t.title);if(!dt)return;TAB[t.title]={date:dt,rows:mkRows(t.rows,dt)};ok++});
   if(!ok)throw new Error("nenhuma aba lida");upd=Date.now();err=null;busy=false;draw();return}
  let list=CFG.TABS.map(([t,g])=>({t,g,p:false}));
  if(CFG.API_KEY){const r=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${CFG.SID}?fields=sheets.properties.title&key=${CFG.API_KEY}`);if(!r.ok)throw new Error("API "+r.status);list=(await r.json()).sheets.map(x=>({t:x.properties.title,g:null,p:false})).filter(x=>dateOf(x.t))}
  else{const have=new Set(list.map(x=>dateOf(x.t)));for(let k=-1;k<=CFG.PROBE_DIAS;k++){const d=new Date(Date.now()+k*864e5).toLocaleDateString("pt-BR",{timeZone:"America/Cuiaba"});if(!have.has(d)){const[a,b]=d.split("/");list.push({t:"Agendamento "+a+"."+b,g:null,p:true})}}}
  let ok=0,fail=0;
  await Promise.all(list.map(async x=>{try{TAB[x.t]=await readTab(x.t,x.g,x.p);ok++}catch(e){if(!x.p)fail++}}));
  if(!ok)throw new Error("nenhuma aba lida");
  upd=Date.now();err=fail?{code:"parcial"}:null}
 catch(e){err={code:"leitura"}}
 busy=false;draw()}
const EM={leitura:"Não foi possível ler a planilha. Confirme que ela está compartilhada como “Qualquer pessoa com o link” (leitor).",parcial:"Algumas abas não puderam ser lidas."};
const byDate=()=>{const o={};Object.values(TAB).forEach(t=>{o[t.date]=(o[t.date]||[]).concat(t.rows)});if(!o[hoje])o[hoje]=[];return o};
const dkey=d=>d.split("/").reverse().join("-");
function sel(){const B=byDate(),ks=Object.keys(B).sort((a,b)=>dkey(a).localeCompare(dkey(b)));
 if(day!=="Todas"&&day!=="Intervalo"&&!B[day])day=hoje;
 if(day==="Intervalo")return ks.filter(k=>{const i=dkey(k);return(!$("d1").value||i>=$("d1").value)&&(!$("d2").value||i<=$("d2").value)}).flatMap(k=>B[k]);
 return day==="Todas"?ks.flatMap(k=>B[k]):B[day]}
function draw(){
 const B=byDate(),ks=Object.keys(B).sort((a,b)=>dkey(a).localeCompare(dkey(b)));
 $("dbtn").textContent="📅 "+(day==="Todas"?"Todas as datas":day==="Intervalo"?"Intervalo personalizado":day.slice(0,5)+(day===hoje?" (hoje)":"")+" · "+((B[day]||[]).length)+" cargas")+" ▾";if(!$("cal").hidden)renderCal();
 const h=upd?new Date(upd).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",second:"2-digit"}):"";
 const n=Object.keys(TAB).length;
 $("status").innerHTML=(err?`<span class="err">${esc(EM[err.code]||("Falha ao ler a planilha ("+err.code+")"))}</span>${/approval|consent/.test(err.code)?' <button id="perm">Permitir acesso ao Google Sheets</button>':""}${n?" Exibindo os últimos dados lidos.":""} `:"")+(upd?`Planilha “Controle Recebimento Filial BG” · atualizado às ${h} · ${n} aba(s) · atualização automática a cada 1 min`:(err?"":"Carregando a planilha…"));
 const rows=sel(),tot=rows.length,cnt=g=>rows.filter(g).length;
 if(!tot){["stack","leg","tipos","dur","alerts","tb"].forEach(i=>$(i).innerHTML="");$("sel").innerHTML="";$("kpis").innerHTML='<div class="card" style="grid-column:1/-1"><div class="k">Sem dados</div><div class="n">Nenhuma carga lançada para esta data na planilha.</div></div>';return}
 const sts=[...ORD,...new Set(rows.map(r=>r.st).filter(s=>!ORD.includes(s)))].filter(s=>cnt(r=>r.st===s)>0);
 const dd=rows.filter(r=>r.du!=null),norm=dd.filter(r=>r.du<240),avg=norm.length?Math.round(norm.reduce((s,r)=>s+r.du,0)/norm.length):null;
 const c=s=>cnt(r=>r.st===s);
 $("kpis").innerHTML=[["Total de cargas",tot,"no período"],["Concluídas",c("Concluído"),Math.round(c("Concluído")/tot*100)+"% do total"],["Em andamento",c("Em Andamento"),"no pátio"],["Agendadas",c("Agendado"),"aguardando"],["Atrasadas / canceladas",c("Atrasado")+c("Cancelado"),c("Atrasado")+" atrasada(s) · "+c("Cancelado")+" cancelada(s)"],["Tempo médio",avg==null?"–":avg+" min","sem durações acima de 4h ("+norm.length+" cargas)"]].map(([k,v,x])=>`<div class="card"><div class="k">${k}</div><div class="v">${v}</div><div class="n">${x}</div></div>`).join("");
 const colr=s=>COL[s]||"var(--mut)";
 $("stack").innerHTML=sts.map(s=>`<div style="width:${c(s)/tot*100}%;background:${colr(s)}"></div>`).join("");
 $("leg").innerHTML=sts.map(s=>`<span><b style="background:${colr(s)}"></b>${esc(s)}: ${c(s)}</span>`).join("");
 const tps=[...new Set(rows.map(r=>r.tp))].map(t=>[t,cnt(r=>r.tp===t)]).sort((a,b)=>b[1]-a[1]);
 $("tipos").innerHTML=tps.map(([t,k])=>`<div class="row"><span>${esc(t)}</span><div class="bar"><i style="width:${k/tps[0][1]*100}%;background:var(--ag)"></i></div><b>${k}</b></div>`).join("");
 const top=dd.slice().sort((a,b)=>b.du-a.du).slice(0,12),mx=top.length?top[0].du:1;
 $("dur").innerHTML=top.length?top.map(r=>`<div class="row"><span>${esc(r.t)}</span><div class="bar"><i style="width:${Math.max(r.du/mx*100,2)}%;background:${r.du>=240?"var(--bad)":"var(--ok)"}"></i></div><b>${fmt(r.du)}</b></div>`).join(""):'<div class="n">Sem cargas com início e fim registrados.</div>';
 const sf=rows.filter(r=>r.st==="Concluído"&&!r.fim),inc=rows.filter(r=>r.inc),lg=rows.filter(r=>r.du>=240),late=rows.filter(r=>r.atraso>30),sa=rows.filter(r=>!r.ag);
 const L=[];
 if(sf.length)L.push(`<b>${sf.length} carga(s) “Concluído” sem horário de fim</b> – não entram no cálculo de duração.`);
 if(inc.length)L.push(`<b>${inc.length} carga(s) com fim anterior ao início:</b> ${inc.slice(0,4).map(r=>esc(r.t)).join(", ")}.`);
 if(lg.length)L.push(`<b>${lg.length} descarregamento(s) com mais de 4h:</b> ${lg.slice(0,4).map(r=>esc(r.t)+" ("+fmt(r.du)+")").join(", ")}.`);
 if(late.length)L.push(`<b>${late.length} chegada(s) com mais de 30 min de atraso:</b> ${late.slice(0,4).map(r=>esc(r.t)+" (+"+r.atraso+" min)").join(", ")}.`);
 if(c("Atrasado"))L.push(`<b>Atrasadas:</b> ${rows.filter(r=>r.st==="Atrasado").slice(0,5).map(r=>esc(r.t)).join(", ")}.`);
 if(c("Cancelado"))L.push(`<b>Canceladas:</b> ${rows.filter(r=>r.st==="Cancelado").slice(0,5).map(r=>esc(r.t)).join(", ")}.`);
 L.push(`<b>${sa.length} carga(s) sem horário agendado.</b>`);
 $("alerts").innerHTML=L.map(x=>`<li>${x}</li>`).join("");
 $("sel").innerHTML=["Todos",...sts].map(s=>`<button data-s="${esc(s)}" class="${s===f?"on":""}">${esc(s)}</button>`).join("");
 $("tb").innerHTML=rows.filter(r=>f==="Todos"||r.st===f).map(r=>`<tr><td data-label="Data">${r.date.slice(0,5)}</td><td data-label="Transportadora">${esc(r.t)}</td><td data-label="Tipo">${esc(r.tp)}</td><td data-label="Agendado">${r.ag||"–"}</td><td data-label="Início">${r.ini||"–"}</td><td data-label="Fim">${r.fim||"–"}</td><td data-label="Duração">${fmt(r.du)}</td><td data-label="Atraso">${r.atraso==null?"–":(r.atraso>0?"+":"")+r.atraso+" min"}</td><td data-label="Status"><span class="pill" style="background:${colr(r.st)}">${esc(r.st)}</span></td><td data-label="Obs.">${esc(r.ob)}</td></tr>`).join("")}
let cm=null;
const MES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const cmOf=d=>{const x=(d&&d.includes("/")?d:hoje).split("/");return x[2]+"-"+x[1]};
function renderCal(){const B=byDate(),[y,mo]=(cm||cmOf(day)).split("-").map(Number),st=new Date(y,mo-1,1).getDay(),dim=new Date(y,mo,0).getDate();
 let h=`<div class="ch"><button data-n="-1" aria-label="Mês anterior">‹</button><b>${MES[mo-1]} ${y}</b><button data-n="1" aria-label="Próximo mês">›</button></div><div class="cg">`+["D","S","T","Q","Q","S","S"].map(x=>`<span class="dw">${x}</span>`).join("");
 for(let i=0;i<st;i++)h+="<span></span>";
 for(let d=1;d<=dim;d++){const k=String(d).padStart(2,"0")+"/"+String(mo).padStart(2,"0")+"/"+y,n=B[k]?B[k].length:0;
  h+=`<button type="button" class="dd${k===day?" sel":""}${k===hoje?" td":""}" data-d="${k}" title="${n} carga(s)">${d}${n?`<i class="dot">${n}</i>`:""}</button>`}
 h+=`</div><div class="cf"><button type="button" data-d="Todas">Todas as datas</button><button type="button" data-d="${hoje}">Hoje</button></div>`;$("cal").innerHTML=h}
function pickDay(d){day=d;f="Todos";const iso=d.includes("/")?dkey(d):"";$("d1").value=iso;$("d2").value=iso;$("cal").hidden=true;draw()}
$("dbtn").addEventListener("click",e=>{e.stopPropagation();const o=$("cal").hidden;$("cal").hidden=!o;if(o){cm=cmOf(day);renderCal()}});
$("cal").addEventListener("click",e=>{e.stopPropagation();const b=e.target.closest("button");if(!b)return;
 if(b.dataset.n){let[y,mo]=(cm||cmOf(day)).split("-").map(Number);mo+=+b.dataset.n;if(mo<1){mo=12;y--}if(mo>12){mo=1;y++}cm=y+"-"+String(mo).padStart(2,"0");renderCal()}
 else if(b.dataset.d)pickDay(b.dataset.d)});
document.addEventListener("click",()=>{$("cal").hidden=true});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("cal").hidden=true});
$("sel").addEventListener("click",e=>{const s=e.target.dataset&&e.target.dataset.s;if(s==null)return;f=s;draw()});
["d1","d2"].forEach(i=>$(i).addEventListener("change",()=>{day="Intervalo";f="Todos";draw()}));
$("hj").addEventListener("click",()=>{day=hoje;f="Todos";$("d1").value=$("d2").value="";draw()});
draw();
$("rf").addEventListener("click",refresh);
refresh();setInterval(refresh,60000);
</script></body></html>
